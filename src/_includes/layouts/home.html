{% extends "layouts/base.html" %}
{% set pageCriticalStyles = ['home.scss'] %}
{% block content %}
<div class="wrapper">
  <h3 class="[ color-olive-light ]">{{ title }}</h3>
</div>
<div class="[ panel dot-shadow ] [ bg-charcoal ]">
  <div class="wrapper">
    <article class="home-intro">
      {{ content | safe }}
    </article>
    <article class="[ gallery ] [ flow flow-space-800 ]">
      {% for item in collections.projects %}
      <figure class="[ gallery__item ] [ flow ]">
        <div class="[ gallery__media ] [ frame ]" data-frame="primary">
          <img class="radius height-auto" src="{{ item.data.hero.image }}" alt="{{ item.data.hero.imageAlt }}" />
        </div>
        <figcaption class="[ gallery__content ] [ flow ]">
          <h3 class="[ gallery__heading ] [ text-600 md:text-800 color-light ]">
            {{ item.data.title }}
          </h3>
          <p class="[ gallery__summary ] [ measure-short flow-space-300 color-olive-light ]">
            {{ item.data.summary }}
          </p>
          <a href="{{ item.url }}" class="button">{{ item.data.buttonLabel }}</a>
        </figcaption>
      </figure>
      {% endfor %}
    </article>
  </div>
</div>
{% endblock %}
